<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toffee & Shantel - Private Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth-easing: cubic-bezier(0.4, 0, 0.2, 1);
            --bounce-easing: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            transition: background 0.4s var(--smooth-easing), color 0.4s var(--smooth-easing); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif; 
            overflow: hidden; 
            height: 100vh;
            height: 100dvh;
            position: fixed;
            width: 100%;
            touch-action: manipulation;
            -webkit-overflow-scrolling: auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .theme-dark { background: #1a5c73; color: #EBF5F8; }
        .theme-dark .glass { 
            background: rgba(20, 65, 80, 0.9); 
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .theme-dark .bubble-me { 
            background: linear-gradient(135deg, #4CC9F0, #3db8df); 
            color: #0a1a24; 
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.2);
        }
        .theme-dark .bubble-them { 
            background: rgba(255, 255, 255, 0.1); 
            color: #EBF5F8; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .theme-dark .input-field { 
            background: rgba(0, 0, 0, 0.25); 
            border: 1.5px solid rgba(255, 255, 255, 0.1); 
            color: white; 
        }
        
        .theme-light { background: #dceef5; color: #1a5c73; }
        .theme-light .glass { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
        }
        .theme-light .bubble-me { 
            background: linear-gradient(135deg, #1a5c73, #2A829E); 
            color: white; 
            box-shadow: 0 4px 15px rgba(26, 92, 115, 0.2);
        }
        .theme-light .bubble-them { 
            background: white; 
            color: #1a5c73; 
            border: 1px solid #BDD9E1; 
        }
        .theme-light .input-field {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(26, 92, 115, 0.15);
            color: #1a5c73;
        }
        
        .status-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: #22c55e; 
            display: inline-block; 
            margin-right: 6px; 
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
            animation: pulse-dot 2s var(--smooth-easing) infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 4px rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 12px rgba(34, 197, 94, 0.8); }
        }
        
        #chat-box {
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.15); 
            border-radius: 10px; 
        }
        
        .call-modal { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.97); 
            z-index: 1000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeIn 0.3s var(--smooth-easing);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .remote-video { 
            width: 100%; 
            max-width: 400px; 
            border-radius: 24px; 
            background: #1a1a2e; 
            min-height: 300px; 
            object-fit: cover; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .local-video { 
            position: absolute; 
            bottom: 100px; 
            right: 16px; 
            width: 100px; 
            border-radius: 16px; 
            border: 2px solid rgba(255,255,255,0.8); 
            background: #000; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            animation: slideUp 0.4s var(--spring-easing);
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @media (max-width: 600px) { 
            .local-video { width: 80px; bottom: 90px; } 
            .remote-video { min-height: 250px; } 
        }
        
        .msg-pop { 
            animation: msgPop 0.35s var(--spring-easing); 
        }
        
        @keyframes msgPop { 
            from { 
                opacity: 0; 
                transform: translateY(10px) scale(0.95); 
            } 
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            } 
        }
        
        .message-container { 
            position: relative; 
            transition: transform 0.3s var(--spring-easing);
            will-change: transform;
            touch-action: pan-y;
        }
        
        .message-container:active {
            transition: none;
        }
        
        .swipe-hint { 
            position: absolute; 
            left: 8px; 
            top: 50%; 
            transform: translateY(-50%); 
            opacity: 0; 
            color: #4CC9F0; 
            font-size: 18px; 
            transition: opacity 0.2s var(--smooth-easing);
            pointer-events: none;
            text-shadow: 0 0 10px rgba(76, 201, 240, 0.5);
        }
        
        .message-container.swiping .swipe-hint { 
            opacity: 1;
            animation: hintPulse 0.6s var(--smooth-easing) infinite alternate;
        }
        
        @keyframes hintPulse {
            from { transform: translateY(-50%) scale(1); }
            to { transform: translateY(-50%) scale(1.2); }
        }
        
        .message-container.swiping {
            transition: transform 0.1s linear;
        }
        
        button {
            transition: all 0.2s var(--smooth-easing);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        button:active {
            transform: scale(0.92);
            transition: transform 0.1s var(--smooth-easing);
        }
        
        input {
            transition: all 0.3s var(--smooth-easing);
            -webkit-appearance: none;
        }
        
        input:focus {
            border-color: #4CC9F0 !important;
            box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.15);
            outline: none;
        }
        
        .glass {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        #reply-preview {
            animation: slideUp 0.3s var(--spring-easing);
            border-radius: 16px 16px 0 0;
            margin-bottom: -1px;
        }
        
        #typing-indicator {
            min-height: 1.25rem;
        }
        
        #typing-indicator:not(:empty) {
            animation: fadeIn 0.3s var(--smooth-easing);
        }
        
        .ripple {
            animation: ripple 0.6s var(--smooth-easing) forwards;
        }
        
        @keyframes ripple {
            to { box-shadow: 0 0 0 12px rgba(76, 201, 240, 0); }
        }

        /* New styles for input container with reply */
        .input-container {
            position: relative;
            z-index: 10;
        }

        .reply-preview-bottom {
            background: rgba(59, 130, 246, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            border-left: 3px solid #4CC9F0;
            border-radius: 16px 16px 0 0;
            margin: 0 1rem;
            transition: all 0.3s var(--spring-easing);
        }
    </style>
</head>
<body id="main-body" class="theme-dark flex items-center justify-center p-2">

    <div id="login-screen" class="glass p-8 rounded-[3rem] w-full max-w-sm text-center shadow-2xl" style="animation: fadeIn 0.6s var(--spring-easing);">
        <div class="text-5xl mb-3" style="animation: float 3s ease-in-out infinite;">💎</div>
        <h2 class="text-lg font-black mb-6 tracking-[0.2em] text-blue-500 uppercase">TOFFEE & SHANTEL</h2>
        <input id="nameInput" type="text" placeholder="Name: ENTER THE SECREAT NAME!" class="input-field w-full p-3 rounded-2xl mb-3 outline-none text-center" autocomplete="off">
        <input id="passInput" type="password" placeholder="Key" class="input-field w-full p-3 rounded-2xl mb-5 outline-none text-center">
        <button onclick="checkAccess()" class="w-full bg-blue-600 text-white p-3 rounded-2xl font-bold shadow-lg transition-all hover:bg-blue-500">ACCESS</button>
        <p class="text-[9px] opacity-50 mt-4">Key: Ask LYN or FEE😊</p>
    </div>

    <div id="chat-screen" class="hidden w-full max-w-md h-[95vh] h-[95dvh] flex flex-col glass rounded-[3rem] overflow-hidden relative shadow-2xl" style="animation: fadeIn 0.5s var(--smooth-easing);">
        <div class="p-4 border-b border-white/10 flex justify-between items-center shrink-0">
            <div id="active-users" class="flex flex-col text-xs"></div>
            <div class="flex gap-2">
                <button id="theme-btn" onclick="toggleTheme()" class="bg-slate-800/40 w-9 h-9 rounded-full text-lg hover:bg-slate-700/50">🌙</button>
                <div class="relative">
                    <button onclick="toggleMoodMenu()" class="bg-slate-800/40 w-9 h-9 rounded-full text-lg hover:bg-slate-700/50">😊</button>
                    <div id="mood-menu" class="hidden absolute right-0 mt-2 p-2 bg-slate-800/95 backdrop-blur-lg rounded-2xl flex gap-2 z-50 border border-white/10" style="animation: slideDown 0.3s var(--spring-easing);">
                        <button onclick="updateMood('📚')" class="text-xl px-2 hover:scale-110 transition-transform">📚</button>
                        <button onclick="updateMood('😴')" class="text-xl px-2 hover:scale-110 transition-transform">😴</button>
                        <button onclick="updateMood('🍕')" class="text-xl px-2 hover:scale-110 transition-transform">🍕</button>
                        <button onclick="updateMood('🎵')" class="text-xl px-2 hover:scale-110 transition-transform">🎵</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-2"></div>
        <div id="typing-indicator" class="px-5 py-1 text-[9px] italic text-blue-400 h-5 shrink-0 opacity-0 transition-opacity duration-300"></div>

        <!-- Reply preview moved right above input -->
        <div class="input-container shrink-0">
            <div id="reply-preview" class="hidden reply-preview-bottom px-4 py-2.5 flex justify-between items-center text-xs">
                <div class="flex-1 min-w-0 flex items-center gap-2">
                    <span class="text-blue-400 text-lg">↩️</span>
                    <div class="flex-1 min-w-0">
                        <span id="reply-user" class="font-bold text-blue-400 text-[10px]"></span>
                        <span class="opacity-40 mx-1 text-[10px]">replying to</span>
                        <span id="reply-text" class="opacity-70 truncate text-[10px]"></span>
                    </div>
                </div>
                <button onclick="cancelReply()" class="text-white/50 text-base leading-4 ml-2 hover:text-white/80 transition-colors p-1">✕</button>
            </div>
            
            <div class="p-4 flex gap-2">
                <input id="msgInput" type="text" placeholder="Type a message..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMessage()" class="input-field flex-1 p-3 rounded-2xl outline-none text-sm" autocomplete="off">
                <button onclick="sendMessage()" class="bg-blue-600 text-white w-12 h-12 rounded-2xl font-bold shadow-lg text-xl hover:bg-blue-500 active:bg-blue-700">➤</button>
            </div>
        </div>
    </div>

    <div id="call-modal" class="call-modal hidden">
        <div class="relative w-full max-w-md px-4">
            <video id="remote-video" class="remote-video" autoplay playsinline></video>
            <video id="local-video" class="local-video" autoplay playsinline muted></video>
            <div class="absolute bottom-6 left-0 right-0 flex justify-center gap-3">
                <button onclick="hangUp()" class="bg-red-600 text-white px-5 py-2.5 rounded-full font-bold shadow-lg text-sm hover:bg-red-500">📞 Hang Up</button>
                <button id="toggle-mic" onclick="toggleMic()" class="bg-gray-700/80 backdrop-blur text-white px-3 py-2.5 rounded-full text-lg hover:bg-gray-600">🎤</button>
                <button id="toggle-cam" onclick="toggleCam()" class="bg-gray-700/80 backdrop-blur text-white px-3 py-2.5 rounded-full text-lg hover:bg-gray-600">📷</button>
            </div>
            <p id="call-status" class="text-center text-white mt-4 text-xs font-medium">Connecting...</p>
        </div>
    </div>

    <div id="incoming-call-modal" class="call-modal hidden">
        <div class="glass p-8 rounded-[3rem] text-center" style="animation: msgPop 0.5s var(--spring-easing);">
            <div class="text-4xl mb-4" style="animation: float 2s ease-in-out infinite;">📞</div>
            <h2 id="incoming-call-title" class="text-lg font-bold mb-4">Incoming Call</h2>
            <p id="incoming-call-text" class="mb-6">From: User</p>
            <div class="flex gap-4 justify-center">
                <button onclick="acceptIncoming()" class="bg-green-600 text-white px-6 py-3 rounded-2xl font-bold hover:bg-green-500">Accept</button>
                <button onclick="rejectIncoming()" class="bg-red-600 text-white px-6 py-3 rounded-2xl font-bold hover:bg-red-500">Reject</button>
            </div>
        </div>
    </div>

    <script type="module">
        const ALLOWED_USERS = ["Toffee", "Shantel"];
        const ACCESS_KEY = "toffee";
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildChanged, onValue, set, update, serverTimestamp, onDisconnect, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDw_WkrANnsPvrnhqONu4Jx7U8BkrduL38",
            authDomain: "private-chart.firebaseapp.com",
            databaseURL: "https://private-chart-default-rtdb.firebaseio.com", 
            projectId: "private-chart",
            storageBucket: "private-chart.appspot.com",
            messagingSenderId: "808076132779",
            appId: "1:808076132779:web:456dbb1336d73ab661d2ee"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');
        const callsRef = ref(db, 'calls');
        
        let currentUser = "";
        let replyingTo = null;
        let localStream = null;
        let peerConnection = null;
        let currentCallId = null;
        let pendingCandidates = [];
        let callListeners = [];
        
        let incomingCallId = null;
        let incomingCallData = null;
        
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');
        msgSound.volume = 0.5;
        
        const callRing = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        callRing.loop = true;
        callRing.volume = 0.7;
        
        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
            ],
            iceCandidatePoolSize: 10
        };

        // Prevent zooming
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());
        document.addEventListener('gestureend', (e) => e.preventDefault());
        
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        // Close mood menu when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('mood-menu');
            if (menu && !menu.classList.contains('hidden') && !e.target.closest('#mood-menu') && !e.target.closest('button[onclick*="mood-menu"]')) {
                menu.classList.add('hidden');
            }
        });

        window.toggleMoodMenu = () => {
            document.getElementById('mood-menu').classList.toggle('hidden');
        };

        function removeCallListeners() {
            callListeners.forEach(({ ref, listener }) => {
                off(ref, listener);
            });
            callListeners = [];
        }

        window.toggleTheme = () => {
            const body = document.getElementById('main-body');
            const isLight = body.classList.toggle('theme-light');
            const btn = document.getElementById('theme-btn');
            btn.innerText = isLight ? "☀️" : "🌙";
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
        };

        window.checkAccess = () => {
            const name = document.getElementById('nameInput').value.trim();
            const pass = document.getElementById('passInput').value;
            
            if (pass === ACCESS_KEY && name !== "" && ALLOWED_USERS.includes(name)) {
                currentUser = name;
                document.getElementById('login-screen').style.animation = 'fadeIn 0.3s var(--smooth-easing) reverse';
                setTimeout(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('chat-screen').classList.remove('hidden');
                    setUserStatus();
                    loadMessages();
                    listenForCalls();
                }, 250);
            } else if (pass !== ACCESS_KEY) {
                shakeElement(document.getElementById('passInput'));
                alert("Wrong key!");
            } else if (!ALLOWED_USERS.includes(name)) { 
                shakeElement(document.getElementById('nameInput'));
                alert("ENTER YOUR SECRET NAME!");
            }
        };

        function shakeElement(el) {
            el.style.animation = 'none';
            el.offsetHeight;
            el.style.animation = 'shake 0.5s var(--smooth-easing)';
            setTimeout(() => el.style.animation = '', 500);
        }

        // Add shake animation
        const shakeStyle = document.createElement('style');
        shakeStyle.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-8px); }
                40% { transform: translateX(8px); }
                60% { transform: translateX(-4px); }
                80% { transform: translateX(4px); }
            }
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-10px); }
            }
            @keyframes slideDown {
                from { transform: translateY(-100%); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
        `;
        document.head.appendChild(shakeStyle);

        function setUserStatus() {
            const statusRef = ref(db, `status/${currentUser}`);
            set(statusRef, { online: true, lastSeen: new Date().toISOString(), typing: false, mood: "👋" });
            onDisconnect(statusRef).update({ online: false, lastSeen: new Date().toISOString(), typing: false });
            
            onValue(ref(db, 'status'), (snapshot) => {
                const statuses = snapshot.val();
                let html = "", typingHtml = "";
                
                for(let u in statuses) {
                    if(u !== currentUser && ALLOWED_USERS.includes(u)) {
                        const s = statuses[u];
                        const dot = s.online ? '<span class="status-dot"></span>' : '<span style="color: #94a3b8; margin-right: 6px;">●</span>';
                        
                        let timeDisplay = s.online ? 'Online now' : 'Offline';
                        if (!s.online && s.lastSeen) {
                            const mins = Math.floor((new Date() - new Date(s.lastSeen)) / 60000);
                            timeDisplay = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : `${Math.floor(mins/60)} hr ago`;
                        }
                        
                        const moodStr = s.mood ? ` ${s.mood}` : "";
                        const callBtns = s.online ? `
                            <div class="flex gap-1 mt-1">
                                <button onclick="window.startCall('${u}','audio')" class="text-[9px] bg-blue-600/60 hover:bg-blue-500/60 px-2 py-0.5 rounded-full transition-all">🎵 Call</button>
                                <button onclick="window.startCall('${u}','video')" class="text-[9px] bg-green-600/60 hover:bg-green-500/60 px-2 py-0.5 rounded-full transition-all">📹 Video</button>
                            </div>
                        ` : '';
                        
                        html += `<div class="mb-2 p-1.5 rounded-lg bg-white/5 hover:bg-white/10 transition-colors"><div class="text-xs font-bold flex items-center">${dot}${u}${moodStr}</div><div class="text-[9px] opacity-50">${timeDisplay}</div>${callBtns}</div>`;
                        if(s.typing) typingHtml = `${u} is typing...`;
                    }
                }
                document.getElementById('active-users').innerHTML = html || '<div class="text-xs opacity-50 p-2">No other users online</div>';
                
                const typingEl = document.getElementById('typing-indicator');
                typingEl.innerHTML = typingHtml;
                typingEl.style.opacity = typingHtml ? '1' : '0';
            });
        }

        window.startCall = async (targetUser, type) => {
            if (peerConnection) {
                alert("Already in a call");
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: type === 'video', 
                    audio: true 
                });
                
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('call-modal').classList.remove('hidden');
                document.getElementById('call-status').innerText = `Calling ${targetUser}...`;
                
                currentCallId = `${currentUser}_to_${targetUser}_${Date.now()}`;
                const callData = {
                    from: currentUser,
                    to: targetUser,
                    type: type,
                    status: 'calling',
                    timestamp: serverTimestamp(),
                    createdAt: Date.now()
                };
                await set(ref(db, `calls/${currentCallId}`), callData);
                
                callRing.play();
                
                peerConnection = new RTCPeerConnection(rtcConfig);
                pendingCandidates = [];
                
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        push(ref(db, `calls/${currentCallId}/candidates`), event.candidate);
                    }
                };
                
                peerConnection.ontrack = (event) => {
                    document.getElementById('remote-video').srcObject = event.streams[0];
                    document.getElementById('call-status').innerText = `Connected to ${targetUser}`;
                };
                
                peerConnection.onconnectionstatechange = () => {
                    if (peerConnection.connectionState === 'connected') {
                        document.getElementById('call-status').innerText = `Connected to ${targetUser}`;
                        update(ref(db, `calls/${currentCallId}`), { status: 'connected' });
                        callRing.pause();
                        callRing.currentTime = 0;
                    } else if (['disconnected', 'failed', 'closed'].includes(peerConnection.connectionState)) {
                        hangUp();
                    }
                };
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await update(ref(db, `calls/${currentCallId}`), { 
                    offer: { type: offer.type, sdp: offer.sdp },
                    status: 'offer_sent'
                });
                
                const answerRef = ref(db, `calls/${currentCallId}/answer`);
                const answerListener = onValue(answerRef, (snapshot) => {
                    const answer = snapshot.val();
                    if (answer && peerConnection && peerConnection.signalingState === 'have-local-offer') {
                        peerConnection.setRemoteDescription(new RTCSessionDescription(answer)).catch(() => {});
                    }
                });
                callListeners.push({ ref: answerRef, listener: answerListener });
                
                const statusRef = ref(db, `calls/${currentCallId}/status`);
                const statusListener = onValue(statusRef, (snapshot) => {
                    const status = snapshot.val();
                    if (status === 'rejected') {
                        alert(`${targetUser} rejected the call`);
                        hangUp();
                    } else if (status === 'ended' && peerConnection) {
                        hangUp();
                    }
                });
                callListeners.push({ ref: statusRef, listener: statusListener });
                
                const candidatesRef = ref(db, `calls/${currentCallId}/candidates`);
                const candidateListener = onChildAdded(candidatesRef, (snapshot) => {
                    const candidate = snapshot.val();
                    if (candidate) {
                        if (peerConnection && peerConnection.remoteDescription) {
                            peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
                        } else {
                            pendingCandidates.push(candidate);
                        }
                    }
                });
                callListeners.push({ ref: candidatesRef, listener: candidateListener });
                
                const waitForRemoteDesc = setInterval(() => {
                    if (peerConnection && peerConnection.remoteDescription) {
                        while (pendingCandidates.length) {
                            peerConnection.addIceCandidate(new RTCIceCandidate(pendingCandidates.shift())).catch(e => console.log(e));
                        }
                        clearInterval(waitForRemoteDesc);
                    }
                }, 500);
                
            } catch (err) {
                console.error(err);
                alert("Cannot access camera/microphone. Please check permissions.");
                hangUp();
            }
        };

        function listenForCalls() {
            onChildAdded(callsRef, (snapshot) => {
                const call = snapshot.val();
                if (call.to === currentUser && call.status === 'calling') {
                    incomingCallId = snapshot.key;
                    incomingCallData = call;
                    document.getElementById('incoming-call-title').innerText = `${call.type.toUpperCase()} Call`;
                    document.getElementById('incoming-call-text').innerText = `From: ${call.from}`;
                    document.getElementById('incoming-call-modal').classList.remove('hidden');
                    callRing.play();
                    
                    // Auto-reject after 60 seconds
                    setTimeout(() => {
                        if (incomingCallId === snapshot.key && document.getElementById('incoming-call-modal').classList.contains('hidden') === false) {
                            window.rejectIncoming();
                        }
                    }, 60000);
                }
            });
        }

        async function acceptCall(callId, call) {
            if (peerConnection) {
                alert("Already in a call");
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: call.type === 'video', 
                    audio: true 
                });
                
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('call-modal').classList.remove('hidden');
                document.getElementById('call-status').innerText = `Connecting to ${call.from}...`;
                currentCallId = callId;
                
                peerConnection = new RTCPeerConnection(rtcConfig);
                pendingCandidates = [];
                
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        push(ref(db, `calls/${callId}/candidates`), event.candidate);
                    }
                };
                
                peerConnection.ontrack = (event) => {
                    document.getElementById('remote-video').srcObject = event.streams[0];
                    document.getElementById('call-status').innerText = `Connected to ${call.from}`;
                };
                
                peerConnection.onconnectionstatechange = () => {
                    if (peerConnection.connectionState === 'connected') {
                        document.getElementById('call-status').innerText = `Connected to ${call.from}`;
                        update(ref(db, `calls/${callId}`), { status: 'connected' });
                    } else if (['disconnected', 'failed', 'closed'].includes(peerConnection.connectionState)) {
                        hangUp();
                    }
                };
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                if (!call.offer) {
                    hangUp();
                    return;
                }
                
                await peerConnection.setRemoteDescription(new RTCSessionDescription(call.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await update(ref(db, `calls/${callId}`), { 
                    answer: { type: answer.type, sdp: answer.sdp }
                });
                
                const candidatesRef = ref(db, `calls/${callId}/candidates`);
                const candidateListener = onChildAdded(candidatesRef, (snapshot) => {
                    const candidate = snapshot.val();
                    if (candidate) {
                        if (peerConnection && peerConnection.remoteDescription) {
                            peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
                        } else {
                            pendingCandidates.push(candidate);
                        }
                    }
                });
                callListeners.push({ ref: candidatesRef, listener: candidateListener });
                
                const waitForRemoteDesc = setInterval(() => {
                    if (peerConnection && peerConnection.remoteDescription) {
                        while (pendingCandidates.length) {
                            peerConnection.addIceCandidate(new RTCIceCandidate(pendingCandidates.shift())).catch(e => console.log(e));
                        }
                        clearInterval(waitForRemoteDesc);
                    }
                }, 500);
                
            } catch (err) {
                console.error(err);
                alert("Call failed");
                hangUp();
            }
        }

        window.acceptIncoming = () => {
            acceptCall(incomingCallId, incomingCallData);
            document.getElementById('incoming-call-modal').classList.add('hidden');
            callRing.pause();
            callRing.currentTime = 0;
            incomingCallId = null;
            incomingCallData = null;
        };

        window.rejectIncoming = () => {
            if (incomingCallId) {
                update(ref(db, `calls/${incomingCallId}`), { status: 'rejected' });
            }
            document.getElementById('incoming-call-modal').classList.add('hidden');
            callRing.pause();
            callRing.currentTime = 0;
            incomingCallId = null;
            incomingCallData = null;
        };

        window.hangUp = () => {
            removeCallListeners();
            
            callRing.pause();
            callRing.currentTime = 0;
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (currentCallId) {
                update(ref(db, `calls/${currentCallId}`), { status: 'ended' }).catch(() => {});
                currentCallId = null;
            }
            pendingCandidates = [];
            
            document.getElementById('call-modal').classList.add('hidden');
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('local-video').srcObject = null;
        };

        window.toggleMic = () => {
            const audioTrack = localStream?.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('toggle-mic').style.opacity = audioTrack.enabled ? '1' : '0.5';
            }
        };
        
        window.toggleCam = () => {
            const videoTrack = localStream?.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                document.getElementById('toggle-cam').style.opacity = videoTrack.enabled ? '1' : '0.5';
            }
        };

        window.updateMood = (mood) => {
            update(ref(db, `status/${currentUser}`), { mood: mood });
            document.getElementById('mood-menu').classList.add('hidden');
        };

        window.handleTyping = () => {
            update(ref(db, `status/${currentUser}`), { typing: document.getElementById('msgInput').value.length > 0 });
        };

        window.setReply = (data) => {
            replyingTo = data;
            document.getElementById('reply-user').textContent = data.username;
            document.getElementById('reply-text').textContent = data.message.substring(0, 50);
            document.getElementById('reply-preview').classList.remove('hidden');
            document.getElementById('msgInput').focus();
        };

        window.cancelReply = () => {
            replyingTo = null;
            const preview = document.getElementById('reply-preview');
            preview.style.animation = 'slideUp 0.2s var(--smooth-easing) reverse';
            setTimeout(() => {
                preview.classList.add('hidden');
                preview.style.animation = 'slideUp 0.3s var(--spring-easing)';
            }, 180);
        };

        window.sendMessage = () => {
            const text = document.getElementById('msgInput').value.trim();
            if (text) {
                push(messagesRef, {
                    username: currentUser,
                    message: text,
                    seen: false,
                    timestamp: serverTimestamp(),
                    replyTo: replyingTo
                });
                document.getElementById('msgInput').value = "";
                cancelReply();
                update(ref(db, `status/${currentUser}`), { typing: false });
                
                // Add ripple effect to send button
                const sendBtn = document.querySelector('button[onclick="sendMessage()"]');
                sendBtn.classList.add('ripple');
                setTimeout(() => sendBtn.classList.remove('ripple'), 600);
            }
        };

        function loadMessages() {
            onChildAdded(messagesRef, (snapshot) => {
                const data = snapshot.val();
                if (data.username !== currentUser && !data.seen) {
                    update(ref(db, `messages/${snapshot.key}`), { seen: true });
                    msgSound.play().catch(() => {});
                }
                renderMessage(snapshot);
            });
            
            onChildChanged(messagesRef, (snapshot) => {
                const msgElement = document.getElementById(`msg-${snapshot.key}`);
                if (msgElement && snapshot.val().seen) {
                    const statusSpan = msgElement.querySelector('.read-status');
                    if (statusSpan) {
                        statusSpan.innerHTML = 'Seen';
                        statusSpan.classList.add('text-blue-400');
                    }
                }
            });
        }

        function renderMessage(snapshot) {
            const data = snapshot.val();
            const isMe = data.username === currentUser;
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.id = `msg-${snapshot.key}`;
            div.className = `message-container flex ${isMe ? 'flex-row-reverse' : 'flex-row'} mb-2 gap-2 msg-pop`;
            
            const timeStr = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            const replyHtml = data.replyTo ? `<div class="bg-black/20 p-1.5 rounded-lg mb-1 text-[9px] border-l-2 border-blue-400"><b>${escapeHtml(data.replyTo.username)}</b>: ${escapeHtml(data.replyTo.message.substring(0, 40))}</div>` : '';
            
            div.innerHTML = `
                <div class="swipe-hint">↩️</div>
                <div class="${isMe ? 'bubble-me rounded-l-2xl rounded-tr-2xl' : 'bubble-them rounded-r-2xl rounded-tl-2xl'} p-3 max-w-[80%] shadow-sm">
                    ${replyHtml}
                    <p class="text-[9px] opacity-60 font-bold mb-0.5 uppercase">${escapeHtml(data.username)}</p>
                    <p class="text-sm break-words">${escapeHtml(data.message)}</p>
                    <div class="flex justify-end gap-1 mt-1">
                        <span class="text-[8px] opacity-40">${timeStr}</span>
                        ${isMe ? `<span class="read-status text-[8px] font-bold ${data.seen ? 'text-blue-400' : 'text-gray-400'}">${data.seen ? 'Seen' : '✓✓'}</span>` : ''}
                    </div>
                </div>
            `;
            
            // Smooth swipe to reply
            let startX = 0;
            let startY = 0;
            let swiping = false;
            let swipeOffset = 0;
            
            div.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                swiping = false;
                swipeOffset = 0;
                div.style.transition = 'none';
            });
            
            div.addEventListener('touchmove', (e) => {
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const diffX = currentX - startX;
                const diffY = Math.abs(currentY - startY);
                
                if (Math.abs(diffX) > 8 && diffY < 25) {
                    if (diffX > 0) {
                        swiping = true;
                        swipeOffset = Math.min(diffX * 0.8, 80);
                        div.classList.add('swiping');
                        div.style.transform = `translateX(${swipeOffset}px)`;
                        e.preventDefault();
                    }
                }
            });
            
            div.addEventListener('touchend', (e) => {
                div.style.transition = 'transform 0.3s var(--spring-easing)';
                div.classList.remove('swiping');
                div.style.transform = 'translateX(0)';
                
                if (swiping && swipeOffset > 50) {
                    setReply(data);
                }
                swiping = false;
                swipeOffset = 0;
            });
            
            // Mouse swipe for desktop
            let isMouseDown = false;
            
            div.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                startX = e.clientX;
                startY = e.clientY;
                swipeOffset = 0;
                div.style.transition = 'none';
            });
            
            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const diffX = e.clientX - startX;
                const diffY = Math.abs(e.clientY - startY);
                
                if (Math.abs(diffX) > 8 && diffY < 25 && diffX > 0) {
                    swipeOffset = Math.min(diffX * 0.8, 80);
                    div.classList.add('swiping');
                    div.style.transform = `translateX(${swipeOffset}px)`;
                }
            });
            
            window.addEventListener('mouseup', (e) => {
                if (!isMouseDown) return;
                isMouseDown = false;
                div.style.transition = 'transform 0.3s var(--spring-easing)';
                div.classList.remove('swiping');
                div.style.transform = 'translateX(0)';
                
                if (swipeOffset > 50) {
                    setReply(data);
                }
                swipeOffset = 0;
            });
            
            chatBox.appendChild(div);
            
            // Smooth scroll to bottom
            requestAnimationFrame(() => {
                chatBox.scrollTo({
                    top: chatBox.scrollHeight,
                    behavior: 'smooth'
                });
            });
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
